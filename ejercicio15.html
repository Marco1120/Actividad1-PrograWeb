<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Promedio, mayor y menor de un Estudiantes</title>
        <link rel="stylesheet" href="css/ejercicio15.css">
        <script src="js/ejercicio15.js"></script>
    </head>

    <body>
        <h1>Registro de estudiantes</h1>

        <label>Nombre del estudiante: </label>
        <input type="text" id="nombre">
        <br>
        <label>Calificación: </label>
        <input type="text" id="calificacion">
        <br>
        <button onclick="agregarEstudiante()">Agregar estudiante</button>
        <button onclick="calcular()">Calcular</button>
        <br>
        <label>Calificación promedio: </label>
        <input type="text" id="promedio" readonly>
        <br>
        <label>Estudiante con calificación más alta: </label>
        <input type="text" id="mayor" readonly>
        <br>
        <label>Estudiante con calificación más baja: </label>
        <input type="text" id="menor" readonly>
    </body>
</html>
